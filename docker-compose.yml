# Arranque: docker compose up --build
# Lee las variables del fichero .env (copia de .env.example con valores reales).

services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Desde PostgreSQL 18 los datos se montan en /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    networks:
      - smartcampus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    image: smartcampus:latest
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${APP_PORT:-8000}:8000"
    networks:
      - smartcampus-net
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

networks:
  smartcampus-net:

volumes:
  db-data:
